<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RepairRecord{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-[#f7f6f2] text-stone-900 antialiased">
  <header class="border-b border-stone-200 bg-[#fffdf8]">
    <div class="mx-auto flex max-w-2xl items-center justify-between px-4 py-4">
      <a href="/" class="font-semibold tracking-tight">RepairRecord<span class="text-amber-700">.</span></a>
      <a href="/issues" class="min-h-10 inline-flex items-center text-sm font-medium text-stone-500 hover:text-stone-900">My issues</a>
    </div>
  </header>

  <main class="mx-auto max-w-2xl px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <footer class="mx-auto max-w-2xl px-4 pb-10">
    <div class="border-l-4 border-amber-600 bg-[#fff7df] p-4 pl-5 text-sm text-amber-950 shadow-sm sm:p-5 sm:pl-6">
      <div class="flex gap-3">
        <span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-amber-600 text-xs font-bold text-white" aria-hidden="true">i</span>
        <div>
          <p class="font-semibold">Documentation, not legal advice</p>
          <p class="mt-1 leading-6 text-amber-900">
            RepairRecord records what happened and prepares a template notice. For advice about your situation, talk to
            <a class="font-medium underline decoration-amber-700 underline-offset-2" href="https://studentlegalservices.ufsg.ufl.edu/">UF Student Legal Services</a>
            (UF students) or
            <a class="font-medium underline decoration-amber-700 underline-offset-2" href="https://www.trls.org/">Three Rivers Legal Services</a>.
          </p>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
