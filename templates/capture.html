{% extends "base.html" %}
{% block content %}

<h1 class="text-2xl font-semibold tracking-tight">Document a repair problem</h1>
<p class="mt-1 text-stone-600">
  One photo and one sentence. We timestamp it, and draft the written notice
  Florida law requires before you have any leverage.
</p>

<form method="post" action="/issues" enctype="multipart/form-data" class="mt-6 space-y-5">

  <div>
    <label class="block text-sm font-medium">Photo</label>
    <input type="file" name="photo" accept="image/*" capture="environment"
           class="mt-1 block w-full rounded-lg border border-stone-300 bg-white p-3 text-sm">
    <p class="mt-1 text-xs text-stone-500">Opens your camera on a phone.</p>
  </div>

  <div>
    <label class="block text-sm font-medium">What's wrong?</label>
    <textarea name="description" rows="3" required
      placeholder="AC stopped blowing cold air 9 days ago. It's 88°F inside. I texted twice, no response."
      class="mt-1 block w-full rounded-lg border border-stone-300 p-3 text-sm"></textarea>
  </div>

  <!-- PERSON A: these five persist in localStorage so the 2nd issue takes 10 seconds. -->
  <details class="rounded-lg border border-stone-200 bg-white p-4" open>
    <summary class="cursor-pointer text-sm font-medium">Your details &amp; landlord</summary>
    <div class="mt-3 grid gap-3">
      <input name="tenant_name"      id="f_tenant_name"      placeholder="Your name"
             class="rounded-lg border border-stone-300 p-2.5 text-sm">
      <input name="tenant_contact"   id="f_tenant_contact"   placeholder="Phone or email"
             class="rounded-lg border border-stone-300 p-2.5 text-sm">
      <input name="unit_address"     id="f_unit_address"     placeholder="Unit address"
             class="rounded-lg border border-stone-300 p-2.5 text-sm">
      <input name="landlord_name"    id="f_landlord_name"    placeholder="Landlord or property manager"
             class="rounded-lg border border-stone-300 p-2.5 text-sm">
      <input name="landlord_address" id="f_landlord_address" placeholder="Landlord mailing address"
             class="rounded-lg border border-stone-300 p-2.5 text-sm">
    </div>
  </details>

  <button class="w-full rounded-lg bg-stone-900 px-4 py-3.5 font-medium text-white hover:bg-stone-800">
    Document it
  </button>
</form>

<script>
  // Remember the boilerplate fields on this device only.
  const KEYS = ["tenant_name","tenant_contact","unit_address","landlord_name","landlord_address"];
  try {
    KEYS.forEach(k => {
      const el = document.getElementById("f_" + k);
      const v = localStorage.getItem("rr_" + k);
      if (v) el.value = v;
      el.addEventListener("change", () => localStorage.setItem("rr_" + k, el.value));
    });
  } catch (e) { /* private browsing — fine, the form still works */ }
</script>

{% endblock %}
